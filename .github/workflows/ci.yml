name: CI

# Both the Go service and the Flutter client are Windows-only (DPAPI, the
# Windows Service API, and Named Pipes IPC are used unconditionally, with
# no build tags separating out platform-neutral code), and the Flutter
# golden images were captured on Windows. Everything therefore runs on
# windows-latest — Linux runners cannot even build this module.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofumpt
        run: |
          $out = go run mvdan.cc/gofumpt@latest -l .
          if ($out) {
            Write-Output $out
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Built from source with the toolchain from setup-go above, rather
        # than via golangci-lint-action's prebuilt binary: the latest
        # prebuilt release lags behind and refuses to run ("the Go language
        # version used to build golangci-lint is lower than the targeted
        # Go version"). Building from source always matches our toolchain.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout=5m

      - name: go build
        run: go build ./...

      - name: go build (vpsbackupservice.exe)
        run: go build -o bin/vpsbackupservice.exe ./cmd/vpsbackupservice

      - name: go test
        run: go test ./... -count=1

      # NOTE: -race requires CGO with a gcc-compatible compiler, which the
      # windows-latest runner does not provide out of the box. Per policy,
      # this is documented as unavailable here rather than blocking CI;
      # -race is still run locally on native Windows dev hosts.

  flutter:
    name: Flutter
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart format
        run: dart format --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build windows (debug)
        run: flutter build windows --debug
